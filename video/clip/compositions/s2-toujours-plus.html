    const tl = gsap.timeline({ paused: true });
    const words = (sel) => [...document.querySelectorAll(sel)];

    const out = (sel, t) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, t);

    // --- Champ de « + » : grille 10 × 18, ordre d'apparition pseudo-aléatoire (graine fixe), cadence qui accélère
    const field = document.getElementById("s2-field");
    const COLS = 10, ROWS = 18, N = COLS * ROWS;
    let seed = 40;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const order = Array.from({ length: N }, (_, i) => i);
    for (let i = N - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const cells = [];
    for (let i = 0; i < N; i++) {
      const p = document.createElement("div");
      p.className = "s2-p";
      p.textContent = "+";
      p.style.left = (i % COLS) * 116 + "px";
      p.style.top = Math.floor(i / COLS) * 112 + "px";
      field.appendChild(p);
      cells.push(p);
    }
    order.forEach((cellIndex, rank) => {
      const r = rank / N;
      const t = 2.9 + 7.3 * Math.sqrt(r);
      const color = r < 0.4 ? "#0f2044" : "#cd5540";
      tl.fromTo(cells[cellIndex], { opacity: 0, scale: 0.3, color },
        { opacity: r < 0.4 ? 0.16 : 0.32, scale: 1, color, duration: 0.14, ease: "back.out(2)" }, t);
    });

    // --- Tremblement qui s'amplifie (8,6 → 10,4 s), déterministe
    for (let k = 0; k < 40; k++) {
      const t = 8.6 + k * 0.045;
      const amp = 2 + (k / 40) * 12;
      tl.to("#s2-shake", { x: Math.sin(k * 2.3) * amp, y: Math.cos(k * 3.1) * amp * 0.6, duration: 0.044, ease: "none" }, t);
    }
    tl.to("#s2-shake", { x: 0, y: 0, duration: 0.06, ease: "none" }, 10.4);

    // --- Saturation : l'écran vire au rouge sur le dernier « plus »

      { clipPath: "circle(120% at 50% 50%)", duration: 0.45, ease: "power2.inOut" }, 10.3);
    tl.to("#s2-e-plus", { backgroundColor: "#0f2044", duration: 0.2 }, 10.5);

    // --- Phase A : DANS LA SALLE DE SPORT, / C'EST PAREIL.
    wordsIn(words(".s2-aw"), [0.17, 0.39, 0.52, 0.75, 0.86]);
    tl.fromTo("#s2-w-cest", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13 }, 1.13);
    tl.fromTo("#s2-w-pareil", { opacity: 0, fontWeight: 200, scale: 0.9, transformOrigin: "0% 50%" },
      { opacity: 1, fontWeight: 900, scale: 1, duration: 0.5, ease: "expo.out" }, 1.3);
    out("#s2-a > div", 2.7);

    // --- Phase B : POUR PRENDRE DU / MUSCLE,

    tl.fromTo("#s2-muscle", { opacity: 0, fontWeight: 200, scale: 0.9, transformOrigin: "0% 50%" },

    out("#s2-b > div", 4.0);

    // --- Phase C : ON NOUS MET DANS LA TÊTE / QU'IL FAUT FAIRE DES / EFFORTS.

    tl.fromTo("#s2-efforts1", { opacity: 0, fontWeight: 300 }, { opacity: 1, fontWeight: 900, duration: 0.45, ease: "expo.out" }, 5.79);
    out("#s2-c > div", 7.15);

    // --- Phase D : TOUJOURS PLUS D'EFFORTS (étiquettes qui claquent)

    slam("#s2-d-tj", 7.43); slam("#s2-d-plus", 7.89); slam("#s2-d-eff", 8.1);

    slam("#s2-e-tj", 9.88); slam("#s2-e-plus", 10.21);
