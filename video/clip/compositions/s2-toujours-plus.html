  <div data-hf-id="hf-bmd6" id="root" data-composition-id="s2" data-width="1080" data-height="1920">

      <div data-hf-id="hf-qhli" id="s2-flood-clip" class="clip" data-start="0" data-duration="7.5" data-track-index="2" data-layout-ignore>

      <!-- « Pour prendre de la masse, » -->
      <div data-hf-id="hf-jbw6" id="s2-a" class="clip s2-stage" data-start="0" data-duration="1.5" data-track-index="3">
        <div data-hf-id="hf-yeow">

  <script>
    const tl = gsap.timeline({ paused: true });

    // --- Champ de « + » : grille 10 × 18, ordre d'apparition pseudo-aléatoire (graine fixe), cadence qui accélère
    const field = document.getElementById("s2-field");
    const COLS = 10, ROWS = 18, N = COLS * ROWS;
    let seed = 40;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const order = Array.from({ length: N }, (_, i) => i);
    for (let i = N - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const cells = [];
    for (let i = 0; i < N; i++) {
      const p = document.createElement("div");
      p.className = "s2-p";
      p.textContent = "+";
      p.style.left = (i % COLS) * 116 + "px";
      p.style.top = Math.floor(i / COLS) * 112 + "px";
      field.appendChild(p);
      cells.push(p);
    }
    order.forEach((cellIndex, rank) => {
      const r = rank / N;
      const t = 2.1 + 4.6 * Math.sqrt(r);
      const color = r < 0.4 ? "#141414" : "#a4321f";
      tl.fromTo(cells[cellIndex], { opacity: 0, scale: 0.3, color },
        { opacity: r < 0.4 ? 0.16 : 0.32, scale: 1, color, duration: 0.14, ease: "back.out(2)" }, t);
    });

    // --- Tremblement qui s'amplifie (5,3 → 6,9 s), déterministe
    for (let k = 0; k < 40; k++) {
      const t = 5.3 + k * 0.04;
      const amp = 2 + (k / 40) * 12;
      tl.to("#s2-shake", { x: Math.sin(k * 2.3) * amp, y: Math.cos(k * 3.1) * amp * 0.6, duration: 0.039, ease: "none" }, t);
    }
    tl.to("#s2-shake", { x: 0, y: 0, duration: 0.06, ease: "none" }, 6.9);

    // --- Saturation : l'écran vire au rouge
    tl.fromTo("#s2-flood", { clipPath: "circle(0% at 50% 50%)" },
      { clipPath: "circle(120% at 50% 50%)", duration: 0.45, ease: "power2.inOut" }, 6.6);
    tl.to("#s2-d-plus", { backgroundColor: "#141414", duration: 0.2 }, 6.75);

    // --- Phase A : POUR PRENDRE DE LA / MASSE
    [0.15, 0.35, 0.66, 0.78].forEach((t, i) => {
      tl.fromTo(document.querySelectorAll(".s2-aw")[i], { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13 }, t);
    });
    tl.fromTo("#s2-masse", { opacity: 0, fontWeight: 200, scale: 0.9, transformOrigin: "0% 50%" },
      { opacity: 1, fontWeight: 900, scale: 1, duration: 0.5, ease: "expo.out" }, 0.9);
    tl.to("#s2-a > div", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, 1.33);

    // --- Phase B : IL FAUT DES / EFFORTS.
    [1.59, 1.8, 1.94].forEach((t, i) => {
      tl.fromTo(document.querySelectorAll(".s2-bw")[i], { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13 }, t);
    });
    tl.fromTo("#s2-efforts1", { opacity: 0, fontWeight: 300 }, { opacity: 1, fontWeight: 900, duration: 0.45, ease: "expo.out" }, 2.11);
    tl.to("#s2-b > div", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, 3.08);

    // --- Phase C : TOUJOURS PLUS D'EFFORTS (étiquettes qui claquent)
    const slam = (sel, t) => tl.fromTo(sel, { opacity: 0, scale: 1.25, transformOrigin: "0% 50%" },
      { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out" }, t);
    slam("#s2-c-tj", 3.34); slam("#s2-c-plus", 3.84); slam("#s2-c-eff", 4.07);
    tl.to("#s2-c > div", { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power3.in" }, 5.03);

    // --- Phase D : TOUJOURS PLUS DE PERFORMANCE
    slam("#s2-d-tj", 5.29); slam("#s2-d-plus", 5.61); slam("#s2-d-de", 5.83); slam("#s2-d-perf", 5.94);

    window.__timelines["s2"] = tl;
  </script>
