<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #faf6ec;
      }

  </head>

    <!-- Test : scènes 1 et 2 (0 → 14,1 s). Les scènes 3 à 8 viendront ensuite. -->

        data-height="1920"

        data-width="1080"
        data-height="1920"
      ></div>
      <audio

      window.__timelines["main"] = gsap.timeline({ paused: true });
