<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi des larmes — Yoga With Balls</title>
<style>
  :root {
    --ywb-green: #0f3d2e;
    --ywb-green-dark: #0a2a20;
    --ywb-gold: #d4af37;
    --ywb-cream: #faf6ec;
    --ywb-red: #a4321f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--ywb-cream);
    color: var(--ywb-green-dark);
    padding: 2rem 1rem 4rem;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  a.back {
    color: var(--ywb-green);
    text-decoration: none;
    font-weight: 600;
  }
  .logo {
    font-size: 0.9rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ywb-gold);
    margin: 1.5rem 0 0.25rem;
  }
  h1 { color: var(--ywb-green); margin-top: 0.25rem; }
  p.lead { color: #4a4a3d; }
  form {
    background: white;
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 4px 14px rgba(15, 61, 46, 0.08);
    margin-top: 1.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 1rem;
    align-items: end;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.4rem;
    font-size: 0.9rem;
  }
  input {
    width: 100%;
    padding: 0.6rem 0.7rem;
    border: 1px solid #cfc9b3;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  button {
    background: var(--ywb-red);
    color: white;
    border: none;
    padding: 0.75rem;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    height: fit-content;
  }
  button:hover { background: #8a2a18; }
  .totals {
    margin-top: 1.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1rem;
  }
  .total-card {
    background: var(--ywb-green);
    color: var(--ywb-cream);
    border-radius: 12px;
    padding: 1.1rem;
    text-align: center;
  }
  .total-card .value {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--ywb-gold);
  }
  .total-card .label {
    font-size: 0.85rem;
    margin-top: 0.25rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1.5rem;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(15, 61, 46, 0.08);
  }
  th, td {
    padding: 0.7rem 0.9rem;
    text-align: left;
    border-bottom: 1px solid #eee6d0;
    font-size: 0.9rem;
  }
  th {
    background: var(--ywb-green);
    color: var(--ywb-cream);
  }
  tr:last-child td { border-bottom: none; }
  .empty {
    text-align: center;
    padding: 1.5rem;
    color: #8a8570;
  }
  .delete-btn {
    background: none;
    border: none;
    color: var(--ywb-red);
    cursor: pointer;
    font-weight: 700;
    padding: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../">← Retour à l'accueil</a>
  <div class="logo">Yoga With Balls</div>
  <h1>Suivi des larmes</h1>
  <p class="lead">Consignez chaque séance de marche tai-chi et de pleurs pour suivre votre progression.</p>

  <form id="entry-form">
    <div>
      <label for="date">Date</label>
      <input type="date" id="date" required>
    </div>
    <div>
      <label for="taichi">Marche tai-chi (min)</label>
      <input type="number" id="taichi" min="0" step="0.5" value="3" required>
    </div>
    <div>
      <label for="pleurs">Pleurs (min)</label>
      <input type="number" id="pleurs" min="0" step="0.5" value="2" required>
    </div>
    <button type="submit">Ajouter la séance</button>
  </form>

  <div class="totals">
    <div class="total-card">
      <div class="value" id="totalSeances">0</div>
      <div class="label">Séances enregistrées</div>
    </div>
    <div class="total-card">
      <div class="value" id="totalTaichi">0</div>
      <div class="label">Minutes de marche tai-chi</div>
    </div>
    <div class="total-card">
      <div class="value" id="totalPleurs">0</div>
      <div class="label">Minutes de pleurs</div>
    </div>
  </div>

  <table>
    <thead>
      <tr><th>Date</th><th>Tai-chi (min)</th><th>Pleurs (min)</th><th></th></tr>
    </thead>
    <tbody id="entries-body"></tbody>
  </table>
</div>

<script>
  var STORAGE_KEY = 'ywb-suivi-larmes';

  function loadEntries() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveEntries(entries) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function formatDate(iso) {
    var parts = iso.split('-');
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function render() {
    var entries = loadEntries();
    entries.sort(function (a, b) { return a.date < b.date ? 1 : -1; });

    var tbody = document.getElementById('entries-body');
    tbody.innerHTML = '';

    if (entries.length === 0) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="4" class="empty">Aucune séance enregistrée pour le moment.</td>';
      tbody.appendChild(tr);
    } else {
      entries.forEach(function (entry) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + formatDate(entry.date) + '</td>' +
          '<td>' + entry.taichi + '</td>' +
          '<td>' + entry.pleurs + '</td>' +
          '<td><button class="delete-btn" data-id="' + entry.id + '">Supprimer</button></td>';
        tbody.appendChild(tr);
      });
    }

    var totalTaichi = entries.reduce(function (sum, e) { return sum + e.taichi; }, 0);
    var totalPleurs = entries.reduce(function (sum, e) { return sum + e.pleurs; }, 0);

    document.getElementById('totalSeances').textContent = entries.length;
    document.getElementById('totalTaichi').textContent = totalTaichi.toFixed(1);
    document.getElementById('totalPleurs').textContent = totalPleurs.toFixed(1);

    Array.prototype.forEach.call(document.querySelectorAll('.delete-btn'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        var remaining = loadEntries().filter(function (e) { return String(e.id) !== id; });
        saveEntries(remaining);
        render();
      });
    });
  }

  document.getElementById('entry-form').addEventListener('submit', function (e) {
    e.preventDefault();

    var date = document.getElementById('date').value;
    var taichi = parseFloat(document.getElementById('taichi').value) || 0;
    var pleurs = parseFloat(document.getElementById('pleurs').value) || 0;

    var entries = loadEntries();
    entries.push({ id: Date.now(), date: date, taichi: taichi, pleurs: pleurs });
    saveEntries(entries);

    e.target.reset();
    document.getElementById('taichi').value = 3;
    document.getElementById('pleurs').value = 2;

    render();
  });

  render();
</script>
</body>
</html>
